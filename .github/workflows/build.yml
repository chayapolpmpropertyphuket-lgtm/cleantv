name: Build CleanTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # สร้างกุญแจเซ็นแอปครั้งแรกครั้งเดียว แล้วใช้กุญแจเดิมตลอด
      # เพื่อให้ติดตั้งเวอร์ชันใหม่ทับเวอร์ชันเก่าได้
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "Add signing key [skip ci]"
            git push
          fi
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CleanTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CleanTV build ${{ github.run_number }}
          files: CleanTV.apk
