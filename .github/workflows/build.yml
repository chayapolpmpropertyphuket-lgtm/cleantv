name: Build CleanTV APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'images/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Keep the current signing identity until a tested key migration is planned.
      - name: Load existing signing key
        run: |
          test -f keystore/debug.keystore || (echo "Missing existing signing key; refusing to create a different key" && exit 1)
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Run updater unit tests
        run: gradle testReleaseUnitTest --no-daemon -PversionCode=${{ github.run_number }}

      - name: Run Android Lint
        run: gradle lintRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-${{ github.run_number }}-lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CleanTV.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-${{ github.run_number }}-apk
          path: CleanTV.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CleanTV-${{ github.run_number }}-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CleanTV build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/CleanTV.apk
