name: Build CleanTV APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'images/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Load CleanTV release signing key
        env:
          CLEANTV_KEYSTORE_BASE64: ${{ secrets.CLEANTV_KEYSTORE_BASE64 }}
          CLEANTV_STORE_PASSWORD: ${{ secrets.CLEANTV_STORE_PASSWORD }}
          CLEANTV_KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
          CLEANTV_KEY_PASSWORD: ${{ secrets.CLEANTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLEANTV_KEYSTORE_BASE64"
          test -n "$CLEANTV_STORE_PASSWORD"
          test -n "$CLEANTV_KEY_ALIAS"
          test -n "$CLEANTV_KEY_PASSWORD"
          mkdir -p keystore
          umask 077
          printf '%s' "$CLEANTV_KEYSTORE_BASE64" | base64 --decode > keystore/cleantv-release.jks
          test -s keystore/cleantv-release.jks
          keytool -list -keystore keystore/cleantv-release.jks -storepass "$CLEANTV_STORE_PASSWORD" -alias "$CLEANTV_KEY_ALIAS"

      - name: Run updater unit tests
        run: gradle testReleaseUnitTest --no-daemon -PversionCode=${{ github.run_number }}

      - name: Run Android Lint
        run: gradle lintRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CleanTV-${{ github.run_number }}-lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK
        env:
          CLEANTV_STORE_PASSWORD: ${{ secrets.CLEANTV_STORE_PASSWORD }}
          CLEANTV_KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
          CLEANTV_KEY_PASSWORD: ${{ secrets.CLEANTV_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          EXPECTED_SHA256="F459AFD2075ADCD9B62AFC1FC5ECA6FDED5CA079D8760BC5F17AEDFA98F1E57D"
          ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CleanTV.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: CleanTV-${{ github.run_number }}-apk
          path: CleanTV.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CleanTV-${{ github.run_number }}-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CleanTV build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/CleanTV.apk
